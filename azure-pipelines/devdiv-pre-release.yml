# DevDiv pre-release pipeline for PET.
#
# Migrated from the MonacoTools "python-environment-tools (pre-release)" definition (591, pre-release.yml).
# Like that pipeline, this file only supplies parameters; the build, signing, NOTICE, APIScan, and
# `bin-<target>` artifact logic lives in templates/rust-package.yml, a DevDiv/MicroBuild copy of
# microsoft/vscode-engineering's rust-package template.

trigger:
  branches:
    include:
      - main
schedules:
  - cron: "0 0 * * 0"
    displayName: Weekly build
    branches:
      include:
        - main
    always: true
pr: none

parameters:
  - name: buildPlatforms
    type: object
    default:
      - name: linux
        target: x86_64-unknown-linux-musl
      - name: linux
        target: aarch64-unknown-linux-gnu
      - name: linux
        target: armv7-unknown-linux-gnueabihf
      - name: darwin
        target: aarch64-apple-darwin
      - name: darwin
        target: x86_64-apple-darwin
      - name: windows
        target: aarch64-pc-windows-msvc
      - name: windows
        target: x86_64-pc-windows-msvc

extends:
  template: templates/rust-package.yml
  parameters:
    binaryName: pet
    teamName: VSCode-python-environments
    signing: true
    apiScanSoftwareVersion: '2024' # major version of `pet` for internal reporting
    apiScanConnectionString: RunAs=App;AppId=d318cba7-db4d-4fb3-99e1-01879cb74e91;TenantId=72f988bf-86f1-41af-91ab-2d7cd011db47;ServiceConnectionId=93e24264-c5e6-4681-8175-ec8a41668480;
    windowsAdditionalNotices: $(Build.SourcesDirectory)/azure-pipelines/windows-additional-notices.txt
    buildPlatforms: ${{ parameters.buildPlatforms }}

    preBuildSteps:
      - pwsh: Rename-Item -Path "./.cargo/config.toml.disabled" -NewName "config.toml"
        displayName: Enable Azure Build config for Rust
      - pwsh: ./set-version.ps1 -Suffix "dev.$(Build.BuildId)"
        displayName: Set nightly version
