name: Native macOS Coverage

on:
  pull_request:
    branches: [main, 'release*', 'release/*', 'release-*']
  push:
    branches: [main, 'release*', 'release/*', 'release-*']
  workflow_dispatch:
    inputs:
      same_commit_diagnostic:
        description: Run the bounded unchanged-source coverage experiment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  coverage:
    if: inputs.same_commit_diagnostic != true
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Python to PATH
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Validate Coverage Reporting
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Collect Native macOS Coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info -- --test-threads=1
        env:
          PET_SUBPROCESS_COVERAGE_PROOF: ${{ github.workspace }}/subprocess-coverage.json

      - name: Verify Isolated Server Coverage
        if: always()
        run: python scripts/coverage_detail.py proof --manifest subprocess-coverage.json --output subprocess-coverage

      - name: Report Production and Changed Coverage
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python scripts/coverage_detail.py report --lcov lcov.info --base "$BASE" --output production-coverage

      - name: Measure Exact PR Base on the Same Runner
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/coverage-base-target
          PET_SUBPROCESS_COVERAGE_PROOF: ${{ runner.temp }}/base-subprocess-coverage.json
        run: |
          git worktree add --detach "$RUNNER_TEMP/coverage-base" "$BASE"
          cd "$RUNNER_TEMP/coverage-base"
          cargo llvm-cov --workspace --lcov --output-path "$GITHUB_WORKSPACE/baseline-lcov.info" -- --test-threads=1

      - name: Compare Exact Base Coverage
        if: always() && github.event_name == 'pull_request'
        run: >-
          python scripts/quality_snapshot.py coverage
          --current lcov.info --baseline baseline-lcov.info --platform macOS
          --report coverage-report.md --summary "$GITHUB_STEP_SUMMARY"

      - name: Validate Main Coverage
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/quality_snapshot.py coverage
          --current lcov.info --baseline lcov.info --platform macOS
          --report coverage-report.md --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Native macOS Coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-macos-native
          path: |
            lcov.info
            baseline-lcov.info
            coverage-report.md
            production-coverage/
            subprocess-coverage/
            subprocess-coverage.json
          retention-days: 30

  same-commit-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.same_commit_diagnostic
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout unchanged measurement revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5ac67ce6dc78dd24c2d0e766bd9b07c1f161721a
          fetch-depth: 0
          persist-credentials: false

      - name: Set Python to PATH
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure unchanged source in A B B A order
        run: |
          mkdir -p "$RUNNER_TEMP/macos-aa"
          git worktree add --detach "$RUNNER_TEMP/coverage-base" HEAD
          for pass in head-1 base-1 base-2 head-2; do
            case "$pass" in
              head-*) source="$GITHUB_WORKSPACE"; target="$GITHUB_WORKSPACE/target" ;;
              base-*) source="$RUNNER_TEMP/coverage-base"; target="$RUNNER_TEMP/coverage-base-target" ;;
            esac
            result="$RUNNER_TEMP/macos-aa/$pass"
            mkdir -p "$result"
            (
              cd "$source"
              export CARGO_TARGET_DIR="$target"
              export PET_SUBPROCESS_COVERAGE_PROOF="$result/subprocess-coverage.json"
              {
                git rev-parse HEAD
                rustc -Vv
                cargo llvm-cov --version
                printf 'source=%s\ntarget=%s\npass=%s\n' "$source" "$target" "$pass"
                shasum -a 256 Cargo.lock
              } > "$result/context.txt"
              cargo llvm-cov --workspace --lcov --output-path "$result/lcov.info" -- --test-threads=1
              cargo llvm-cov report --json --output-path "$result/llvm.json"
              cargo llvm-cov report --lcov --output-path "$result/lcov-repeat.info"
              python scripts/coverage_detail.py proof \
                --manifest "$result/subprocess-coverage.json" --output "$result/subprocess-coverage"
              find "$target" -type f \( -name '*.profraw' -o -name '*.profdata' \) -print0 |
                tar --null -czf "$result/profiles.tar.gz" --files-from -
            )
          done

      - name: Compare all predeclared pairs
        run: |
          cd "$RUNNER_TEMP/macos-aa"
          status=0
          for pair in head-1:base-1 base-2:head-2 head-1:head-2 base-1:base-2; do
            current="${pair%:*}"
            baseline="${pair#*:}"
            python "$GITHUB_WORKSPACE/scripts/quality_snapshot.py" coverage \
              --current "$current/lcov.info" --baseline "$baseline/lcov.info" --platform macOS \
              --report "$current-vs-$baseline.md" --summary "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit "$status"

      - name: Upload attempt-qualified diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-aa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-aa/
          retention-days: 14
