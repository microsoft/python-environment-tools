name: Protocol macOS Matched Control

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  matched-control:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f668ed59d95381bbccb2afad2d6783660d578cae
          persist-credentials: false

      - name: Initialize evidence
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/shutdown-matched-control"

      - name: Set Python to PATH
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Create the standard macOS workload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 120 \
            --output "$RUNNER_TEMP/miniconda.sh" \
            https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh
          bash "$RUNNER_TEMP/miniconda.sh" -b -p "$HOME/miniconda"
          echo "PATH=$PATH:$HOME/miniconda/bin" >> "$GITHUB_ENV"
          echo "CONDA=$HOME/miniconda" >> "$GITHUB_ENV"
          "$HOME/miniconda/bin/conda" create -n perf-test-env python=3.12 -y
          python -m venv .venv

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin

      - name: Instrument only the shared test harness after its measured passes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/pet/tests/e2e_performance.rs")
          source = path.read_text()
          for name in ["EnvironmentIdentity", "ManagerIdentity", "Inventory"]:
              marker = f"struct {name} {{"
              assert source.count(marker) == 1
              source = source.replace(marker, "#[derive(serde::Serialize)]\n" + marker)
          marker = 'expected_inventory.expect("Performance summary must run at least one iteration");'
          assert source.count(marker) == 1
          source = source.replace(
              marker,
              marker
              + '\n'
              + '    if let Some(path) = std::env::var_os("PET_DIAGNOSTIC_INVENTORY") {\n'
              + '        std::fs::write(path, serde_json::to_vec(&expected_inventory).unwrap()).unwrap();\n'
              + '    }\n',
          )
          path.write_text(source)
          PY

      - name: Build exact base and head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 094217e69880dabf4a38d166c63a9639e0493de5
          git worktree add --detach "$RUNNER_TEMP/pet-base" 094217e69880dabf4a38d166c63a9639e0493de5
          cargo build --locked --release --target x86_64-apple-darwin --bin pet \
            --manifest-path "$RUNNER_TEMP/pet-base/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/pet-base-target"
          cp "$RUNNER_TEMP/pet-base-target/x86_64-apple-darwin/release/pet" \
            "$RUNNER_TEMP/pet-base-exe"
          cargo build --locked --release --target x86_64-apple-darwin --bin pet
          cp "target/x86_64-apple-darwin/release/pet" "$RUNNER_TEMP/pet-head-exe"
          cargo test --locked --release --features ci-perf \
            --target x86_64-apple-darwin --test e2e_performance \
            --no-run --message-format=json > "$RUNNER_TEMP/pet-test-build.jsonl"
          test "$(git rev-parse HEAD)" = "f668ed59d95381bbccb2afad2d6783660d578cae"
          test "$(git -C "$RUNNER_TEMP/pet-base" rev-parse HEAD)" = \
            "094217e69880dabf4a38d166c63a9639e0493de5"
          BASE_SHA256="$(shasum -a 256 "$RUNNER_TEMP/pet-base-exe" | awk '{print $1}')"
          HEAD_SHA256="$(shasum -a 256 "$RUNNER_TEMP/pet-head-exe" | awk '{print $1}')"
          HARNESS_SHA256="$(shasum -a 256 crates/pet/tests/e2e_performance.rs | awk '{print $1}')"
          export BASE_SHA256 HEAD_SHA256 HARNESS_SHA256
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          provenance = {
              "base": "094217e69880dabf4a38d166c63a9639e0493de5",
              "head": "f668ed59d95381bbccb2afad2d6783660d578cae",
              "baseBinarySha256": os.environ["BASE_SHA256"],
              "headBinarySha256": os.environ["HEAD_SHA256"],
              "harnessSha256": os.environ["HARNESS_SHA256"],
              "rustc": subprocess.run(
                  ["rustc", "-Vv"], check=True, text=True, capture_output=True
              ).stdout,
              "target": "x86_64-apple-darwin",
              "runnerImage": os.environ.get("ImageOS"),
              "runnerImageVersion": os.environ.get("ImageVersion"),
              "runnerArchitecture": platform.machine(),
              "runnerPlatform": platform.platform(),
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "shutdown-matched-control"
          (output / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PY

      - name: Counterbalanced same-host measurements
        timeout-minutes: 30
        shell: bash
        env:
          RUST_BACKTRACE: "1"
          RUST_LOG: warn
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          temp = Path(os.environ["RUNNER_TEMP"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          artifacts = temp / "shutdown-matched-control"
          artifacts.mkdir(exist_ok=True)
          messages = [
              json.loads(line)
              for line in (temp / "pet-test-build.jsonl").read_text().splitlines()
          ]
          tests = [
              message["executable"]
              for message in messages
              if message.get("reason") == "compiler-artifact"
              and message["target"]["name"] == "e2e_performance"
              and message.get("executable")
          ]
          if len(tests) != 1:
              raise RuntimeError(f"Expected one benchmark executable, got {tests!r}")

          executable = (
              workspace / "target" / "x86_64-apple-darwin" / "release" / "pet"
          )
          revisions = {
              "base": "094217e69880dabf4a38d166c63a9639e0493de5",
              "head": "f668ed59d95381bbccb2afad2d6783660d578cae",
          }
          order = ["base", "head", "head", "base", "head", "base", "base", "head"]
          summary = []
          provenance = json.loads((artifacts / "provenance.json").read_text())
          for index, label in enumerate(order, 1):
              source = temp / f"pet-{label}-exe"
              shutil.copy2(source, executable)
              digest = hashlib.sha256(executable.read_bytes()).hexdigest()
              if digest != provenance[f"{label}BinarySha256"]:
                  raise RuntimeError("Benchmark executable did not match recorded provenance")

              inventory = artifacts / f"{index}-{label}.inventory.json"
              environment = dict(
                  os.environ, PET_DIAGNOSTIC_INVENTORY=str(inventory)
              )
              log = artifacts / f"{index}-{label}.log"
              result = {
                  "iteration": index,
                  "label": label,
                  "revision": revisions[label],
                  "sha256": digest,
                  "status": "running",
              }
              summary.append(result)
              summary_path = artifacts / "summary.json"
              summary_path.write_text(json.dumps(summary, indent=2) + "\n")
              failure = None
              try:
                  with log.open("w") as output:
                      subprocess.run(
                          [
                              tests[0],
                              "test_performance_summary",
                              "--exact",
                              "--nocapture",
                          ],
                          cwd=workspace,
                          stdout=output,
                          stderr=subprocess.STDOUT,
                          check=True,
                          timeout=180,
                          env=environment,
                      )
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                  failure = error
                  result["error"] = str(error)
              try:
                  if inventory.is_file():
                      inventory_digest = hashlib.sha256(inventory.read_bytes()).hexdigest()
                      result["inventory_sha256"] = inventory_digest
                      (artifacts / f"{index}-{label}.inventory.sha256").write_text(
                          inventory_digest + "\n"
                      )
                  text = log.read_text()
                  marker = "JSON metrics:\n"
                  if marker not in text or "inventory_sha256" not in result:
                      raise ValueError(f"Pass {index} is missing metrics or full inventory")
                  metrics, _ = json.JSONDecoder().raw_decode(text.rsplit(marker, 1)[1])
                  if not isinstance(metrics, dict):
                      raise ValueError(f"Pass {index} metrics are not an object")
                  (artifacts / f"{index}-{label}.json").write_text(
                      json.dumps(metrics, indent=2) + "\n"
                  )
                  for key in ["environments_count", "managers_count", "stats", "locators", "phases"]:
                      result[key] = metrics[key]
                  for key in ["environments_count", "managers_count"]:
                      if type(metrics[key]) is not int or metrics[key] < 0:
                          raise ValueError(f"Pass {index} has invalid {key}")
                  if not isinstance(metrics["stats"], dict):
                      raise ValueError(f"Pass {index} stats are not an object")
                  for key in ["refresh_round_trip", "server_startup"]:
                      metric = metrics["stats"][key]
                      if not isinstance(metric, dict):
                          raise ValueError(f"Pass {index} {key} is not an object")
                      for percentile in ["p50", "p95"]:
                          if type(metric.get(percentile)) is not int or metric[percentile] < 0:
                              raise ValueError(f"Pass {index} has invalid {key}.{percentile}")
              except (OSError, ValueError, KeyError) as error:
                  result["evidence_error"] = str(error)
                  if failure is None:
                      failure = error
                      result["error"] = str(error)
              result["status"] = "failed" if failure else "completed"
              try:
                  summary_path.write_text(json.dumps(summary, indent=2) + "\n")
              except OSError as error:
                  if failure:
                      raise failure from error
                  raise
              if failure:
                  raise failure
              print(
                  json.dumps(
                      {
                          "iteration": index,
                          "label": label,
                          "revision": revisions[label],
                          "sha256": digest,
                          "inventory_sha256": inventory_digest,
                          "environments_count": metrics["environments_count"],
                          "managers_count": metrics["managers_count"],
                          "refresh": metrics["stats"]["refresh_round_trip"],
                          "startup": metrics["stats"]["server_startup"],
                      }
                  ),
                  flush=True,
              )

          if len(summary) != 8:
              raise RuntimeError(f"Expected eight completed passes, got {len(summary)}")
          if len({result["inventory_sha256"] for result in summary}) != 1:
              raise RuntimeError(
                  "Exact inventory identities differ between base and head workloads"
              )
          if len({result["environments_count"] for result in summary}) != 1:
              raise RuntimeError(
                  "Environment counts differ between base and head workloads"
              )
          if len({result["managers_count"] for result in summary}) != 1:
              raise RuntimeError(
                  "Manager counts differ between base and head workloads"
              )
          PY

      - name: Preserve matched control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: protocol-532-matched-macos
          path: ${{ runner.temp }}/shutdown-matched-control
          if-no-files-found: error
