name: Protocol Windows Matched Control
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  matched-control:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - name: Checkout exact PR head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 6209cbcf6eebd83d4ebfe941ed6cee2501a2bc61
        persist-credentials: false
    - name: Initialize evidence
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\protocol-matched-control" -ErrorAction Stop | Out-Null
    - name: Set Python to PATH
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Create the standard Windows workload
      shell: pwsh
      run: |
        $env:PATH += ";$env:CONDA\condabin"
        "PATH=$env:PATH" >> $env:GITHUB_ENV
        conda create -n perf-test-env python=3.12 -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m venv .venv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: 1.98.1
        targets: x86_64-pc-windows-msvc
    - name: Instrument only the shared test harness after its measured passes
      shell: pwsh
      run: |
        @'
        from pathlib import Path
        path = Path("crates/pet/tests/e2e_performance.rs")
        source = path.read_text()
        for name in ["EnvironmentIdentity", "ManagerIdentity", "Inventory"]:
            marker = f"struct {name} {{"
            assert source.count(marker) == 1
            source = source.replace(marker, "#[derive(serde::Serialize)]\n" + marker)
        marker = 'expected_inventory.expect("Performance summary must run at least one iteration");'
        assert source.count(marker) == 1
        source = source.replace(marker, marker + '\n'
            '    if let Some(path) = std::env::var_os("PET_DIAGNOSTIC_INVENTORY") {\n'
            '        std::fs::write(path, serde_json::to_vec(&expected_inventory).unwrap()).unwrap();\n'
            '    }\n')
        path.write_text(source)
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build exact base and head
      shell: pwsh
      run: |
        git fetch --no-tags --depth=1 origin de7611fc74d96cb5de31a296178f46cc70254964
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git worktree add --detach "$env:RUNNER_TEMP\pet-base" de7611fc74d96cb5de31a296178f46cc70254964
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cargo build --locked --release --target x86_64-pc-windows-msvc --bin pet --manifest-path "$env:RUNNER_TEMP\pet-base\Cargo.toml" --target-dir "$env:RUNNER_TEMP\pet-base-target"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item "$env:RUNNER_TEMP\pet-base-target\x86_64-pc-windows-msvc\release\pet.exe" "$env:RUNNER_TEMP\pet-base-exe" -ErrorAction Stop
        cargo build --locked --release --target x86_64-pc-windows-msvc --bin pet
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item "target\x86_64-pc-windows-msvc\release\pet.exe" "$env:RUNNER_TEMP\pet-head-exe" -ErrorAction Stop
        cargo test --locked --release --features ci-perf --target x86_64-pc-windows-msvc --test e2e_performance --no-run --message-format=json > "$env:RUNNER_TEMP\pet-test-build.jsonl"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ((git rev-parse HEAD) -ne '6209cbcf6eebd83d4ebfe941ed6cee2501a2bc61') { throw 'Unexpected head revision' }
        if ((git -C "$env:RUNNER_TEMP\pet-base" rev-parse HEAD) -ne 'de7611fc74d96cb5de31a296178f46cc70254964') { throw 'Unexpected base revision' }
        @{
            base = 'de7611fc74d96cb5de31a296178f46cc70254964'
            head = '6209cbcf6eebd83d4ebfe941ed6cee2501a2bc61'
            baseBinarySha256 = (Get-FileHash "$env:RUNNER_TEMP\pet-base-exe" -Algorithm SHA256).Hash
            headBinarySha256 = (Get-FileHash "$env:RUNNER_TEMP\pet-head-exe" -Algorithm SHA256).Hash
            harnessSha256 = (Get-FileHash 'crates\pet\tests\e2e_performance.rs' -Algorithm SHA256).Hash
            rustc = (rustc -Vv) -join "`n"
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            processor = $env:PROCESSOR_IDENTIFIER
        } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\protocol-matched-control\provenance.json" -Encoding utf8
    - name: Counterbalanced same-host measurements
      shell: pwsh
      env:
        RUST_BACKTRACE: '1'
        RUST_LOG: warn
      run: "@'\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport subprocess\n\
        \ntemp = Path(os.environ[\"RUNNER_TEMP\"])\nworkspace = Path(os.environ[\"GITHUB_WORKSPACE\"])\nartifacts\
        \ = temp / \"protocol-matched-control\"\nartifacts.mkdir(exist_ok=True)\ncontrol_path = artifacts / \"control-status.json\"\
        \ncontrol = {\"status\": \"running\"}\ncontrol_path.write_text(json.dumps(control, indent=2) + \"\\n\",\
        \ encoding=\"utf-8\")\ntry:\n    messages = [\n        json.loads(line)\n        for line in (temp / \"\
        pet-test-build.jsonl\").read_text(encoding=\"utf-8-sig\").splitlines()\n    ]\n    tests = [\n        message[\"\
        executable\"]\n        for message in messages\n        if message.get(\"reason\") == \"compiler-artifact\"\
        \n        and message[\"target\"][\"name\"] == \"e2e_performance\"\n        and message.get(\"executable\"\
        )\n    ]\n    if len(tests) != 1:\n        raise RuntimeError(f\"Expected one benchmark executable, got\
        \ {tests!r}\")\n    \n    executable = (\n        workspace / \"target\" / \"x86_64-pc-windows-msvc\" /\
        \ \"release\" / \"pet.exe\"\n    )\n    revisions = {\n        \"base\": \"de7611fc74d96cb5de31a296178f46cc70254964\"\
        ,\n        \"head\": \"6209cbcf6eebd83d4ebfe941ed6cee2501a2bc61\",\n    }\n    order = [\"base\", \"head\"\
        , \"head\", \"base\", \"head\", \"base\", \"base\", \"head\"]\n    summary = []\n    provenance = json.loads((artifacts\
        \ / \"provenance.json\").read_text(encoding=\"utf-8-sig\"))\n    for index, label in enumerate(order, 1):\n\
        \        source = temp / f\"pet-{label}-exe\"\n        shutil.copy2(source, executable)\n        digest\
        \ = hashlib.sha256(executable.read_bytes()).hexdigest()\n        if digest != provenance[f\"{label}BinarySha256\"\
        ].lower():\n            raise RuntimeError(\"Benchmark executable did not match recorded provenance\")\n\
        \    \n        inventory = artifacts / f\"{index}-{label}.inventory.json\"\n        environment = dict(\n\
        \            os.environ, PET_DIAGNOSTIC_INVENTORY=str(inventory)\n        )\n        log = artifacts / f\"\
        {index}-{label}.log\"\n        result = {\n            \"iteration\": index,\n            \"label\": label,\n\
        \            \"revision\": revisions[label],\n            \"sha256\": digest,\n            \"status\": \"\
        running\",\n        }\n        summary.append(result)\n        summary_path = artifacts / \"summary.json\"\
        \n        summary_path.write_text(json.dumps(summary, indent=2) + \"\\n\")\n        failure = None\n   \
        \     try:\n            with log.open(\"w\", encoding=\"utf-8\") as output:\n                subprocess.run(\n\
        \                    [\n                        tests[0],\n                        \"test_performance_summary\"\
        ,\n                        \"--exact\",\n                        \"--nocapture\",\n                    ],\n\
        \                    cwd=workspace,\n                    stdout=output,\n                    stderr=subprocess.STDOUT,\n\
        \                    check=True,\n                    timeout=180,\n                    env=environment,\n\
        \                )\n        except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:\n\
        \            failure = error\n            result[\"error\"] = str(error)\n        try:\n            if inventory.is_file():\n\
        \                inventory_digest = hashlib.sha256(inventory.read_bytes()).hexdigest()\n               \
        \ result[\"inventory_sha256\"] = inventory_digest\n                (artifacts / f\"{index}-{label}.inventory.sha256\"\
        ).write_text(\n                    inventory_digest + \"\\n\"\n                )\n            text = log.read_text(encoding=\"\
        utf-8\")\n            marker = \"JSON metrics:\\n\"\n            if marker not in text or \"inventory_sha256\"\
        \ not in result:\n                raise ValueError(f\"Pass {index} is missing metrics or full inventory\"\
        )\n            metrics, _ = json.JSONDecoder().raw_decode(text.rsplit(marker, 1)[1])\n            if not\
        \ isinstance(metrics, dict):\n                raise ValueError(f\"Pass {index} metrics are not an object\"\
        )\n            (artifacts / f\"{index}-{label}.json\").write_text(\n                json.dumps(metrics,\
        \ indent=2) + \"\\n\"\n            )\n            for key in [\"environments_count\", \"managers_count\"\
        , \"stats\", \"locators\", \"phases\"]:\n                result[key] = metrics[key]\n            for key\
        \ in [\"environments_count\", \"managers_count\"]:\n                if type(metrics[key]) is not int or\
        \ metrics[key] < 0:\n                    raise ValueError(f\"Pass {index} has invalid {key}\")\n       \
        \     if not isinstance(metrics[\"stats\"], dict):\n                raise ValueError(f\"Pass {index} stats\
        \ are not an object\")\n            for key in [\"refresh_round_trip\", \"server_startup\", \"discovery_duration\"\
        ,\n                            \"request_time_to_first_env\", \"startup_time_to_first_env\",\n         \
        \                   \"cold_refresh_round_trip\", \"cold_discovery_duration\",\n                        \
        \    \"cold_request_time_to_first_env\", \"cold_startup_time_to_first_env\"]:\n                metric =\
        \ metrics[\"stats\"][key]\n                if not isinstance(metric, dict):\n                    raise ValueError(f\"\
        Pass {index} {key} is not an object\")\n                for percentile in [\"p50\", \"p95\"]:\n        \
        \            if type(metric.get(percentile)) is not int or metric[percentile] < 0:\n                   \
        \     raise ValueError(f\"Pass {index} has invalid {key}.{percentile}\")\n        except (OSError, ValueError,\
        \ KeyError) as error:\n            result[\"evidence_error\"] = str(error)\n            if failure is None:\n\
        \                failure = error\n                result[\"error\"] = str(error)\n        result[\"status\"\
        ] = \"failed\" if failure else \"completed\"\n        try:\n            summary_path.write_text(json.dumps(summary,\
        \ indent=2) + \"\\n\")\n        except OSError as error:\n            if failure:\n                raise\
        \ failure from error\n            raise\n        if failure:\n            raise failure\n        print(\n\
        \            json.dumps(\n                {\n                    \"iteration\": index,\n               \
        \     \"label\": label,\n                    \"revision\": revisions[label],\n                    \"sha256\"\
        : digest,\n                    \"inventory_sha256\": inventory_digest,\n                    \"environments_count\"\
        : metrics[\"environments_count\"],\n                    \"managers_count\": metrics[\"managers_count\"],\n\
        \                    \"refresh\": metrics[\"stats\"][\"refresh_round_trip\"],\n                    \"startup\"\
        : metrics[\"stats\"][\"server_startup\"],\n                }\n            ),\n            flush=True,\n\
        \        )\n    \n    if len(summary) != 8:\n        raise RuntimeError(f\"Expected eight completed passes,\
        \ got {len(summary)}\")\n    if len({result[\"inventory_sha256\"] for result in summary}) != 1:\n      \
        \  raise RuntimeError(\n            \"Exact inventory identities differ between base and head workloads\"\
        \n        )\n    if len({result[\"environments_count\"] for result in summary}) != 1:\n        raise RuntimeError(\n\
        \            \"Environment counts differ between base and head workloads\"\n        )\n    if len({result[\"\
        managers_count\"] for result in summary}) != 1:\n        raise RuntimeError(\n            \"Manager counts\
        \ differ between base and head workloads\"\n        )\nexcept Exception as error:\n    control.update(status=\"\
        failed\", error=f\"{type(error).__name__}: {error}\")\n    try:\n        control_path.write_text(json.dumps(control,\
        \ indent=2) + \"\\n\", encoding=\"utf-8\")\n    except OSError as evidence_error:\n        raise error from\
        \ evidence_error\n    raise\nelse:\n    control[\"status\"] = \"completed\"\n    control_path.write_text(json.dumps(control,\
        \ indent=2) + \"\\n\", encoding=\"utf-8\")\n'@ | python -\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE\
        \ }\n"
      timeout-minutes: 30
    - name: Preserve matched control evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: protocol-532-matched-windows
        path: ${{ runner.temp }}/protocol-matched-control
        if-no-files-found: error
