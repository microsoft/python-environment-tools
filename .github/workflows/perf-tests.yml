name: Performance Tests

on:
  pull_request:
    branches:
      - main
      - release*
      - release/*
      - release-*
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  performance:
    name: E2E Performance Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows
            comment_header: perf-windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: Linux
            comment_header: perf-linux
          - os: macos-15-intel
            target: x86_64-apple-darwin
            conda_arch: x86_64
            platform: macOS
            comment_header: perf-macos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Post In-Progress Comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ matrix.comment_header }}
          message: |
            ## Performance Report (${{ matrix.platform }}) :hourglass_flowing_sand:

            Measuring this revision and exact base `${{ github.event.pull_request.base.sha }}` on the same runner.

      - name: Set Python to PATH
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate Snapshot Comparator
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
        shell: bash

      - name: Add Conda to PATH (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          $path = $env:PATH + ";" + $env:CONDA + "\condabin"
          echo "PATH=$path" >> $env:GITHUB_ENV

      - name: Set up Conda (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: ""
          auto-activate: false
          run-init: false
          conda-remove-defaults: false

      - name: Install Conda + add to PATH (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          CONDA_ARCH: ${{ matrix.conda_arch }}
        run: |
          if [[ "$(uname -m)" != "$CONDA_ARCH" ]]; then
            echo "Conda installer architecture $CONDA_ARCH does not match runner $(uname -m)" >&2
            exit 1
          fi
          curl --fail --location --show-error --output "$RUNNER_TEMP/miniconda.sh" \
            "https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-${CONDA_ARCH}.sh"
          bash "$RUNNER_TEMP/miniconda.sh" -b -p "$HOME/miniconda"
          echo "PATH=$PATH:$HOME/miniconda/bin" >> "$GITHUB_ENV"
          echo "CONDA=$HOME/miniconda" >> "$GITHUB_ENV"
        shell: bash

      - name: Check Conda version
        run: conda info --all

      - name: Create test Conda environment
        run: conda create -n perf-test-env python=3.12 -y

      - name: Create test venv
        run: python -m venv .venv
        shell: bash

      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Prepare Exact Base Worktree
        id: baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Missing or invalid exact base revision" >&2
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/perf-base" "$base"
          mkdir -p baseline-perf
          echo "sha=$base" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Capture Performance Measurement Context
        id: measurement_context
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          MEASUREMENT_TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          def output(*arguments, cwd=None):
              executable = shutil.which(arguments[0])
              if executable is None:
                  raise RuntimeError(f"Required measurement tool not found: {arguments[0]}")
              value = subprocess.check_output(
                  [executable, *arguments[1:]], cwd=cwd, text=True, encoding="utf-8"
              ).strip()
              if not value:
                  raise RuntimeError(f"Empty measurement version: {arguments[0]}")
              return value

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          runner = {key: os.environ[key] for key in (
              "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion"
          )}
          if not all(value.strip() for value in runner.values()):
              raise RuntimeError("Runner image context must not be empty")
          venv_python = (
              workspace / ".venv" / "Scripts" / "python.exe" if os.name == "nt"
              else workspace / ".venv" / "bin" / "python"
          )
          interpreters = {
              "venv": output(str(venv_python), "--version"),
              "conda-base": output("conda", "run", "--name", "base", "python", "--version"),
              "conda-named": output("conda", "run", "--name", "perf-test-env", "python", "--version"),
          }
          for directory, destination, variable in (
              (workspace, workspace, "HEAD_SHA"),
              (Path(os.environ["RUNNER_TEMP"]) / "perf-base", workspace / "baseline-perf", "BASE_SHA"),
          ):
              source = output("git", "rev-parse", "HEAD", cwd=directory)
              if source != os.environ[variable]:
                  raise RuntimeError(f"Unexpected {variable} checkout: {source}")
              context = {
                  "runner": runner,
                  "installed_target": os.environ["MEASUREMENT_TARGET"],
                  "features": "ci-perf",
                  "discovery_workspace": str(workspace),
                  "versions": {
                      "rustc": output("rustc", "-vV", cwd=directory),
                      "cargo": output("cargo", "--version", cwd=directory),
                      "python": output("python", "--version"),
                      "conda": output("conda", "--version"),
                  },
                  "interpreters": interpreters,
              }
              (destination / "source-revision.txt").write_text(source + "\n", encoding="utf-8")
              (destination / "measurement-context.json").write_text(
                  json.dumps(context, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
          PY
        shell: bash

      - name: Cargo Fetch
        run: |
          cargo fetch --locked
          cd "$RUNNER_TEMP/perf-base"
          cargo fetch --locked
        shell: bash

      - name: Build Release and Benchmark Harnesses
        id: build
        env:
          MEASUREMENT_TARGET: ${{ matrix.target }}
        run: |
          for source in "$RUNNER_TEMP/perf-base" "$GITHUB_WORKSPACE"; do
            (
              cd "$source"
              cargo build --frozen --release --target-dir target --target "$MEASUREMENT_TARGET"
              cargo test --frozen --release --target-dir target --features ci-perf --target "$MEASUREMENT_TARGET" \
                --test e2e_performance --no-run
              git diff --exit-code -- Cargo.toml Cargo.lock crates
            )
          done
        shell: bash

      - name: Run Exact Base Performance Tests
        id: base_benchmark
        env:
          MEASUREMENT_TARGET: ${{ matrix.target }}
          RUST_BACKTRACE: 1
          RUST_LOG: warn
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/perf-base"
          cargo test --frozen --release --target-dir target --features ci-perf --target "$MEASUREMENT_TARGET" \
            --test e2e_performance test_performance_summary -- --nocapture 2>&1 \
            | tee "$GITHUB_WORKSPACE/baseline-perf/perf-output.txt"
        shell: bash

      - name: Run Performance Tests
        id: benchmark
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.measurement_context.outcome == 'success'
        run: |
          set -o pipefail
          cargo test --frozen --release --target-dir target --features ci-perf --target "$MEASUREMENT_TARGET" \
            --test e2e_performance test_performance_summary -- --nocapture 2>&1 | tee perf-output.txt
        env:
          MEASUREMENT_TARGET: ${{ matrix.target }}
          RUST_BACKTRACE: 1
          RUST_LOG: warn
        shell: bash

      - name: Extract Performance Metrics
        id: metrics
        if: always() && steps.benchmark.outcome == 'success'
        run: |
          if ! grep -q "JSON metrics:" perf-output.txt; then
            echo "Performance test produced no JSON metrics" >&2
            exit 1
          fi
          sed -n '/JSON metrics:/,/^}/p' perf-output.txt | tail -n +2 > metrics.json
          python -m json.tool metrics.json > /dev/null
          cat metrics.json
        shell: bash

      - name: Extract Exact Base Performance Metrics
        id: base_metrics
        if: always() && steps.base_benchmark.outcome == 'success'
        run: |
          if ! grep -q "JSON metrics:" baseline-perf/perf-output.txt; then
            echo "Exact base performance test produced no JSON metrics" >&2
            exit 1
          fi
          sed -n '/JSON metrics:/,/^}/p' baseline-perf/perf-output.txt | tail -n +2 > baseline-perf/metrics.json
          python -m json.tool baseline-perf/metrics.json > /dev/null
          cat baseline-perf/metrics.json
        shell: bash

      - name: Compare Performance Snapshot
        if: always()
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          MEASUREMENT_TARGET: ${{ matrix.target }}
          HEAD_BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          BASE_BENCHMARK_OUTCOME: ${{ steps.base_benchmark.outcome }}
          HEAD_METRICS_OUTCOME: ${{ steps.metrics.outcome }}
          BASE_METRICS_OUTCOME: ${{ steps.base_metrics.outcome }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import argparse
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from quality_snapshot import SnapshotError, load_json, run_performance, write_report

          report = Path("performance-report.md")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          platform = os.environ["PLATFORM"]

          def context(path):
              value = load_json(path)
              required = {
                  "runner": ("RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion"),
                  "versions": ("rustc", "cargo", "python", "conda"),
                  "interpreters": ("conda-base", "conda-named", "venv"),
              }
              for group, keys in required.items():
                  values = value.get(group)
                  if not isinstance(values, dict) or any(
                      not isinstance(values.get(key), str) or not values[key].strip()
                      for key in keys
                  ):
                      raise SnapshotError(f"Missing {group} measurement context in {path}")
              if (
                  value.get("features") != "ci-perf"
                  or value.get("installed_target") != os.environ["MEASUREMENT_TARGET"]
                  or value.get("discovery_workspace") != str(Path(os.environ["GITHUB_WORKSPACE"]).resolve())
              ):
                  raise SnapshotError(f"Incompatible performance workload in {path}")
              return value

          try:
              for variable in (
                  "HEAD_BENCHMARK_OUTCOME", "BASE_BENCHMARK_OUTCOME",
                  "HEAD_METRICS_OUTCOME", "BASE_METRICS_OUTCOME",
              ):
                  if os.environ.get(variable) != "success":
                      raise SnapshotError(f"Required benchmark or JSON extraction failed: {variable}")
              for filename, variable in (
                  ("source-revision.txt", "HEAD_SHA"),
                  ("baseline-perf/source-revision.txt", "BASE_SHA"),
              ):
                  expected = os.environ.get(variable, "")
                  if (
                      re.fullmatch(r"[0-9a-f]{40}", expected) is None
                      or Path(filename).read_text(encoding="utf-8").strip() != expected
                  ):
                      raise SnapshotError(f"Unexpected source revision in {filename}")
              current = context(Path("measurement-context.json"))
              baseline = context(Path("baseline-perf/measurement-context.json"))
              if current != baseline:
                  raise SnapshotError(
                      "Performance runner, tool, or fixture versions differ; inspect both measurement contexts"
                  )
          except (OSError, UnicodeError, SnapshotError) as error:
              print(f"Invalid performance measurement: {error}", file=sys.stderr)
              write_report(
                  f"## Performance Report ({platform})\n\n:x: **Invalid snapshot:** {error}\n",
                  report, summary,
              )
              raise SystemExit(1)

          raise SystemExit(run_performance(argparse.Namespace(
              current=Path("metrics.json"), baseline=Path("baseline-perf/metrics.json"),
              platform=platform, report=report, summary=summary,
          )))
          PY
        shell: bash

      - name: Upload PR Performance Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-pr-${{ matrix.os }}
          path: |
            metrics.json
            measurement-context.json
            source-revision.txt
            baseline-perf/
            perf-output.txt
            performance-report.md
          if-no-files-found: ignore

      - name: Post Performance Comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ matrix.comment_header }}
          path: performance-report.md
