name: Fixture Windows Matched Control
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  matched-control:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
    - name: Checkout exact PR head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 6772e5c3631116386de3953dec083a2d08b4fcfa
    - name: Initialize evidence
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\fixture-matched-control" -ErrorAction Stop | Out-Null
    - name: Set Python to PATH
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Create the standard Windows workload
      shell: pwsh
      run: |
        $env:PATH += ";$env:CONDA\condabin"
        "PATH=$env:PATH" >> $env:GITHUB_ENV
        conda create -n perf-test-env python=3.12 -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m venv .venv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: 1.98.1
        targets: x86_64-pc-windows-msvc
    - name: Instrument only the shared test harness after its measured passes
      shell: pwsh
      run: |
        @'
        from pathlib import Path
        path = Path("crates/pet/tests/e2e_performance.rs")
        source = path.read_text()
        for name in ["EnvironmentIdentity", "ManagerIdentity", "Inventory"]:
            marker = f"struct {name} {{"
            assert source.count(marker) == 1
            source = source.replace(marker, "#[derive(serde::Serialize)]\n" + marker)
        marker = 'expected_inventory.expect("Performance summary must run at least one iteration");'
        assert source.count(marker) == 1
        source = source.replace(marker, marker + '\n'
            '    if let Some(path) = std::env::var_os("PET_DIAGNOSTIC_INVENTORY") {\n'
            '        std::fs::write(path, serde_json::to_vec(&expected_inventory).unwrap()).unwrap();\n'
            '    }\n')
        path.write_text(source)
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build exact base and head
      shell: pwsh
      run: |
        git fetch --no-tags --depth=1 origin 3bd7eea22298a0a8e9a08079dd2ed44212368214
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git worktree add --detach "$env:RUNNER_TEMP\pet-base" 3bd7eea22298a0a8e9a08079dd2ed44212368214
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cargo build --locked --release --target x86_64-pc-windows-msvc --bin pet --manifest-path "$env:RUNNER_TEMP\pet-base\Cargo.toml" --target-dir "$env:RUNNER_TEMP\pet-base-target"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item "$env:RUNNER_TEMP\pet-base-target\x86_64-pc-windows-msvc\release\pet.exe" "$env:RUNNER_TEMP\pet-base-exe" -ErrorAction Stop
        cargo build --locked --release --target x86_64-pc-windows-msvc --bin pet
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item "target\x86_64-pc-windows-msvc\release\pet.exe" "$env:RUNNER_TEMP\pet-head-exe" -ErrorAction Stop
        cargo test --locked --release --features ci-perf --target x86_64-pc-windows-msvc --test e2e_performance --no-run --message-format=json > "$env:RUNNER_TEMP\pet-test-build.jsonl"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ((git rev-parse HEAD) -ne '6772e5c3631116386de3953dec083a2d08b4fcfa') { throw 'Unexpected head revision' }
        if ((git -C "$env:RUNNER_TEMP\pet-base" rev-parse HEAD) -ne '3bd7eea22298a0a8e9a08079dd2ed44212368214') { throw 'Unexpected base revision' }
        @{
            base = '3bd7eea22298a0a8e9a08079dd2ed44212368214'
            head = '6772e5c3631116386de3953dec083a2d08b4fcfa'
            baseBinarySha256 = (Get-FileHash "$env:RUNNER_TEMP\pet-base-exe" -Algorithm SHA256).Hash
            headBinarySha256 = (Get-FileHash "$env:RUNNER_TEMP\pet-head-exe" -Algorithm SHA256).Hash
            harnessSha256 = (Get-FileHash 'crates\pet\tests\e2e_performance.rs' -Algorithm SHA256).Hash
            rustc = (rustc -Vv) -join "`n"
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            processor = $env:PROCESSOR_IDENTIFIER
        } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\fixture-matched-control\provenance.json" -Encoding utf8
    - name: Counterbalanced same-host measurements
      shell: pwsh
      env:
        RUST_BACKTRACE: '1'
        RUST_LOG: warn
      run: |
        @'
        import hashlib
        import json
        import os
        from pathlib import Path
        import shutil
        import subprocess

        temp = Path(os.environ["RUNNER_TEMP"])
        workspace = Path(os.environ["GITHUB_WORKSPACE"])
        artifacts = temp / "fixture-matched-control"
        artifacts.mkdir(exist_ok=True)
        messages = [json.loads(line) for line in (temp / "pet-test-build.jsonl").read_text(encoding="utf-8-sig").splitlines()]
        tests = [m["executable"] for m in messages if m.get("reason") == "compiler-artifact"
                 and m["target"]["name"] == "e2e_performance" and m.get("executable")]
        if len(tests) != 1:
            raise RuntimeError(f"Expected one benchmark executable, got {tests!r}")
        executable = workspace / "target" / "x86_64-pc-windows-msvc" / "release" / "pet.exe"
        revisions = {"base": "3bd7eea22298a0a8e9a08079dd2ed44212368214",
                     "head": "6772e5c3631116386de3953dec083a2d08b4fcfa"}
        order = ["base", "head", "head", "base", "head", "base", "base", "head"]
        summary = []
        for index, label in enumerate(order, 1):
            source = temp / f"pet-{label}-exe"
            shutil.copy2(source, executable)
            digest = hashlib.sha256(executable.read_bytes()).hexdigest()
            if digest != hashlib.sha256(source.read_bytes()).hexdigest():
                raise RuntimeError("Benchmark executable copy did not match source")
            inventory = temp / f"pet-inventory-{index}.json"
            environment = dict(os.environ, PET_DIAGNOSTIC_INVENTORY=str(inventory))
            log = artifacts / f"{index}-{label}.log"
            try:
                with log.open("w") as output:
                    subprocess.run([tests[0], "test_performance_summary", "--exact", "--nocapture"],
                                   cwd=workspace, stdout=output, stderr=subprocess.STDOUT,
                                   check=True, timeout=180, env=environment)
                inventory_digest = hashlib.sha256(inventory.read_bytes()).hexdigest()
            finally:
                inventory.unlink(missing_ok=True)
            text = log.read_text()
            metrics, _ = json.JSONDecoder().raw_decode(text.split("JSON metrics:\n", 1)[1])
            (artifacts / f"{index}-{label}.json").write_text(json.dumps(metrics, indent=2) + "\n")
            result = {"iteration": index, "label": label, "revision": revisions[label], "sha256": digest,
                      "inventory_sha256": inventory_digest,
                      "environments_count": metrics["environments_count"],
                      "managers_count": metrics["managers_count"],
                      "stats": metrics["stats"], "locators": metrics["locators"], "phases": metrics["phases"]}
            summary.append(result)
            (artifacts / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
            print(json.dumps({"iteration": index, "label": label, "revision": revisions[label],
                              "sha256": digest, "refresh": metrics["stats"]["refresh_round_trip"],
                              "startup": metrics["stats"]["server_startup"]}), flush=True)
        if len({v["inventory_sha256"] for v in summary}) != 1:
            raise RuntimeError("Exact inventory identities differ between base and head workloads")
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Preserve matched control evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fixture-557-matched-windows
        path: ${{ runner.temp }}\fixture-matched-control
        if-no-files-found: error
