name: Coverage

on:
  pull_request:
    branches:
      - main
      - release*
      - release/*
      - release-*

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  measurements:
    name: Coverage measurement (${{ matrix.platform }}, ${{ matrix.revision }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        revision: [base, head]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: Linux
            comment_header: coverage-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows
            comment_header: coverage-windows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Post Coverage Started Comment
        if: >-
          matrix.revision == 'head' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ matrix.comment_header }}
          message: |
            ## Test Coverage Report (${{ matrix.platform }})

            :hourglass_flowing_sand: **Coverage analysis in progress...**

            Comparing against exact base `${{ github.event.pull_request.base.sha }}`.

      - name: Set Python to PATH
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate Snapshot Comparator
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
        shell: bash

      - name: Add Conda to PATH (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          $path = $env:PATH + ";" + $env:CONDA + "\condabin"
          echo "PATH=$path" >> $env:GITHUB_ENV

      - name: Set up Conda (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: ""
          auto-activate: false
          run-init: false
          conda-remove-defaults: false

      - name: Check Conda version
        run: conda info --all

      - name: Create Conda Environments
        run: |
          conda create -n test-env1 python=3.12 -y
          conda create -n test-env-no-python -y
          conda create -p ./prefix-envs/.conda1 python=3.12 -y
          conda create -p ./prefix-envs/.conda-nopy -y

      - name: Install pipenv
        run: pip install pipenv

      - name: Check pipenv version
        run: pipenv --version

      - name: Create a Pipenv Environment
        id: pipenv
        run: |
          pipenv install
          prefix="$(pipenv --venv)"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install virtualenvwrapper (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          pip install virtualenvwrapper
          echo "WORKON_HOME=$HOME/.virtualenvs" >> $GITHUB_ENV
          mkdir -p $HOME/.virtualenvs
          source virtualenvwrapper.sh
          mkvirtualenv venv_wrapper_env1
        shell: bash

      - name: Install virtualenvwrapper-win (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pip install virtualenvwrapper-win
          echo "WORKON_HOME=$HOME/.virtualenvs" >> $GITHUB_ENV
        shell: bash

      - name: Install pyenv (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/pyenv-win/pyenv-win/master/pyenv-win/install-pyenv-win.ps1" -OutFile "./install-pyenv-win.ps1"; &"./install-pyenv-win.ps1"
          $pyenvBin = "$env:USERPROFILE\.pyenv\pyenv-win\bin"
          echo "$pyenvBin" >> $env:GITHUB_PATH
          echo "PYENV_ROOT=$env:USERPROFILE\.pyenv" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install pyenv and pyenv-virtualenv (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          curl https://pyenv.run | bash
          echo "PYENV_ROOT=$HOME/.pyenv" >> $GITHUB_ENV
          echo "PATH=$HOME/.pyenv/bin:$PATH" >> $GITHUB_ENV
        shell: bash

      - name: Check Pyenv version
        run: pyenv --version
        shell: bash

      - name: Install Pyenv Python(s) (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          pyenv install --list
          pyenv install 3.13:latest 3.12:latest 3.9:latest
        shell: bash

      - name: Install Pyenv Python(s) (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pyenv install --list
          pyenv install 3.10.5 3.8.10
        shell: bash

      - name: Create pyenv-virtualenv envs (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          eval "$(pyenv virtualenv-init -)"
          pyenv virtualenv 3.12 pyenv-virtualenv-env1
        shell: bash

      - name: Create .venv
        run: python -m venv .venv
        shell: bash

      - name: Create .venv2
        run: python -m venv .venv2
        shell: bash

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false

      - name: Create Pixi environments
        run: |
          pixi init
          pixi add python
          pixi add --feature dev python
          pixi project environment add --feature dev dev
          pixi install --environment dev
        shell: bash

      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Ensure Git bash is on PATH (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          # Git for Windows is always installed on GitHub-hosted runners.
          # Add its bin dir so taiki-e/install-action can find bash.exe.
          # See https://github.com/actions/partner-runner-images/issues/169
          $gitBin = 'C:\Program Files\Git\bin'
          if (Test-Path (Join-Path $gitBin 'bash.exe')) {
            echo $gitBin >> $env:GITHUB_PATH
            Write-Output "Added $gitBin to PATH"
          } else {
            Write-Warning "bash.exe not found at $gitBin"
          }
        shell: pwsh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cargo Fetch
        run: cargo fetch
        shell: bash

      - name: Capture Coverage Measurement Context
        env:
          MEASUREMENT_TARGET: ${{ matrix.target }}
          CREATED_PIPENV_PREFIX: ${{ steps.pipenv.outputs.prefix }}
        run: |
          git rev-parse HEAD > source-revision.txt
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          def output(*arguments):
              executable = shutil.which(arguments[0])
              if executable is None:
                  raise RuntimeError(f"Required measurement tool not found: {arguments[0]}")
              value = subprocess.check_output(
                  [executable, *arguments[1:]], text=True, encoding="utf-8"
              ).strip()
              if not value:
                  raise RuntimeError(f"Empty measurement version: {arguments[0]}")
              return value

          runner = {key: os.environ[key] for key in (
              "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion"
          )}
          if not all(value.strip() for value in runner.values()):
              raise RuntimeError("Runner image context must not be empty")
          windows = os.name == "nt"
          python_name = "python.exe" if windows else "python"
          venv_bin = "Scripts" if windows else "bin"
          pipenv_prefix = Path(os.environ["CREATED_PIPENV_PREFIX"])
          interpreters = {
              name: output(str(prefix / venv_bin / python_name), "--version")
              for name, prefix in (
                  ("venv", Path(".venv")),
                  ("venv2", Path(".venv2")),
                  ("pipenv", pipenv_prefix),
              )
          }
          for name in ("default", "dev"):
              prefix = Path(".pixi") / "envs" / name
              executable = prefix / python_name if windows else prefix / "bin" / python_name
              interpreters[f"pixi-{name}"] = output(str(executable), "--version")
          for label, selector in (
              ("base", ("--name", "base")),
              ("named", ("--name", "test-env1")),
              ("prefix", ("--prefix", str(Path("prefix-envs/.conda1").resolve()))),
          ):
              interpreters[f"conda-{label}"] = output(
                  "conda", "run", *selector, "python", "--version"
              )
          interpreters["pyenv"] = "\n".join(sorted(
              output("pyenv", "versions", "--bare").splitlines()
          ))
          context = {
              "runner": runner,
              "installed_target": os.environ["MEASUREMENT_TARGET"],
              "coverage_target": "host",
              "features": "ci",
              "versions": {
                  "rustc": output("rustc", "-vV"),
                  "cargo": output("cargo", "--version"),
                  "cargo-llvm-cov": output("cargo", "llvm-cov", "--version"),
                  "python": output("python", "--version"),
                  "conda": output("conda", "--version"),
                  "pipenv": output("pipenv", "--version"),
                  "pyenv": output("pyenv", "--version"),
                  "pixi": output("pixi", "--version"),
              },
              "interpreters": interpreters,
          }
          Path("measurement-context.json").write_text(
              json.dumps(context, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
        shell: bash

      - name: Run Tests with Coverage
        id: coverage
        run: cargo llvm-cov --features ci --lcov --output-path lcov.info -- --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace
          PET_SUBPROCESS_COVERAGE_PROOF: ${{ github.workspace }}/subprocess-coverage.json
        shell: bash

      - name: Verify Isolated Server Coverage
        if: always()
        run: python scripts/coverage_detail.py proof --manifest subprocess-coverage.json --output subprocess-coverage
        shell: bash

      - name: Report Production and Changed Coverage
        if: always()
        run: >-
          python scripts/coverage_detail.py report
          --lcov lcov.info
          --base "${{ github.event.pull_request.base.sha }}"
          --output production-coverage
        shell: bash

      - name: Upload Coverage Measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-measurement-${{ matrix.os }}-${{ matrix.revision }}-${{ github.run_attempt }}
          path: |
            lcov.info
            measurement-context.json
            source-revision.txt
            production-coverage/
            subprocess-coverage/
            subprocess-coverage.json
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: measurements
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: Linux
            comment_header: coverage-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows
            comment_header: coverage-windows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Python to PATH
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download Head Coverage Measurement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-measurement-${{ matrix.os }}-head-${{ github.run_attempt }}

      - name: Download Exact PR Base Coverage
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-measurement-${{ matrix.os }}-base-${{ github.run_attempt }}
          path: baseline-coverage

      - name: Compare Coverage Snapshot
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          MEASUREMENT_TARGET: ${{ matrix.target }}
          MEASUREMENTS_RESULT: ${{ needs.measurements.result }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import argparse
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from quality_snapshot import SnapshotError, load_json, run_coverage, write_report

          report = Path("coverage-report.md")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          platform = os.environ["PLATFORM"]

          def context(path):
              value = load_json(path)
              required = {
                  "runner": ("RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion"),
                  "versions": (
                      "rustc", "cargo", "cargo-llvm-cov", "python",
                      "conda", "pipenv", "pyenv", "pixi",
                  ),
                  "interpreters": (
                      "conda-base", "conda-named", "conda-prefix", "venv", "venv2",
                      "pipenv", "pixi-default", "pixi-dev", "pyenv",
                  ),
              }
              for group, keys in required.items():
                  values = value.get(group)
                  if not isinstance(values, dict) or any(
                      not isinstance(values.get(key), str) or not values[key].strip()
                      for key in keys
                  ):
                      raise SnapshotError(f"Missing {group} measurement context in {path}")
              if (
                  value.get("features") != "ci"
                  or value.get("coverage_target") != "host"
                  or value.get("installed_target") != os.environ["MEASUREMENT_TARGET"]
              ):
                  raise SnapshotError(f"Incompatible coverage workload in {path}")
              return value

          try:
              if os.environ.get("MEASUREMENTS_RESULT") != "success":
                  raise SnapshotError("One or more coverage measurements or required proofs failed")
              for filename, variable in (
                  ("source-revision.txt", "HEAD_SHA"),
                  ("baseline-coverage/source-revision.txt", "BASE_SHA"),
              ):
                  expected = os.environ.get(variable, "")
                  if (
                      re.fullmatch(r"[0-9a-f]{40}", expected) is None
                      or Path(filename).read_text(encoding="utf-8").strip() != expected
                  ):
                      raise SnapshotError(f"Unexpected source revision in {filename}")
              current = context(Path("measurement-context.json"))
              baseline = context(Path("baseline-coverage/measurement-context.json"))
              if current != baseline:
                  raise SnapshotError(
                      "Coverage runner, tool, or fixture versions differ; inspect both measurement contexts"
                  )
          except (OSError, UnicodeError, SnapshotError) as error:
              print(f"Invalid coverage measurement: {error}", file=sys.stderr)
              write_report(
                  f"## Test Coverage Report ({platform})\n\n:x: **Invalid snapshot:** {error}\n",
                  report, summary,
              )
              raise SystemExit(1)

          raise SystemExit(run_coverage(argparse.Namespace(
              current=Path("lcov.info"), baseline=Path("baseline-coverage/lcov.info"),
              platform=platform, report=report, summary=summary,
          )))
          PY
        shell: bash

      - name: Upload PR Coverage Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-pr-${{ matrix.os }}
          path: |
            lcov.info
            measurement-context.json
            source-revision.txt
            baseline-coverage/
            coverage-report.md
            production-coverage/
            subprocess-coverage/
            subprocess-coverage.json
          if-no-files-found: ignore

      - name: Post Coverage Comment
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ matrix.comment_header }}
          path: coverage-report.md
