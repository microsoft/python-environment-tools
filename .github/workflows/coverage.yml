name: Coverage

on:
  pull_request:
    branches:
      - main
      - release*
      - release/*
      - release-*

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  measurements:
    name: Coverage measurement (${{ matrix.platform }}, ${{ matrix.revision }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        revision: [base, head]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: Linux
            comment_header: coverage-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows
            comment_header: coverage-windows
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Post Coverage Started Comment
        if: >-
          matrix.revision == 'head' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ matrix.comment_header }}
          message: |
            ## Test Coverage Report (${{ matrix.platform }})

            :hourglass_flowing_sand: **Coverage analysis in progress...**

            Comparing against exact base `${{ github.event.pull_request.base.sha }}`.

      - name: Set Python to PATH
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate Snapshot Comparator
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
        shell: bash

      - name: Stage Coverage Measurement Helper
        run: >-
          python scripts/quality_measurement.py stage
          --source-dir "$GITHUB_WORKSPACE"
          --output-dir "$RUNNER_TEMP/quality-tools"
          --revision "$GITHUB_SHA"
        shell: bash

      - name: Checkout Measurement Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Add Conda to PATH (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          $path = $env:PATH + ";" + $env:CONDA + "\condabin"
          echo "PATH=$path" >> $env:GITHUB_ENV

      - name: Set up Conda (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: ""
          auto-activate: false
          run-init: false
          conda-remove-defaults: false

      - name: Check Conda version
        run: conda info --all

      - name: Create Conda Environments
        run: |
          conda create -n test-env1 python=3.12 -y
          conda create -n test-env-no-python -y
          conda create -p ./prefix-envs/.conda1 python=3.12 -y
          conda create -p ./prefix-envs/.conda-nopy -y

      - name: Install pipenv
        run: pip install pipenv

      - name: Check pipenv version
        run: pipenv --version

      - name: Create a Pipenv Environment
        id: pipenv
        run: |
          pipenv install
          prefix="$(pipenv --venv)"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install virtualenvwrapper (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          pip install virtualenvwrapper
          echo "WORKON_HOME=$HOME/.virtualenvs" >> $GITHUB_ENV
          mkdir -p $HOME/.virtualenvs
          source virtualenvwrapper.sh
          mkvirtualenv venv_wrapper_env1
        shell: bash

      - name: Install virtualenvwrapper-win (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pip install virtualenvwrapper-win
          echo "WORKON_HOME=$HOME/.virtualenvs" >> $GITHUB_ENV
        shell: bash

      - name: Install pyenv (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/pyenv-win/pyenv-win/master/pyenv-win/install-pyenv-win.ps1" -OutFile "./install-pyenv-win.ps1"; &"./install-pyenv-win.ps1"
          $pyenvBin = "$env:USERPROFILE\.pyenv\pyenv-win\bin"
          echo "$pyenvBin" >> $env:GITHUB_PATH
          echo "PYENV_ROOT=$env:USERPROFILE\.pyenv" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install pyenv and pyenv-virtualenv (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          curl https://pyenv.run | bash
          echo "PYENV_ROOT=$HOME/.pyenv" >> $GITHUB_ENV
          echo "PATH=$HOME/.pyenv/bin:$PATH" >> $GITHUB_ENV
        shell: bash

      - name: Check Pyenv version
        run: pyenv --version
        shell: bash

      - name: Install Pyenv Python(s) (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          pyenv install --list
          pyenv install 3.13:latest 3.12:latest 3.9:latest
        shell: bash

      - name: Install Pyenv Python(s) (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pyenv install --list
          pyenv install 3.10.5 3.8.10
        shell: bash

      - name: Create pyenv-virtualenv envs (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          eval "$(pyenv virtualenv-init -)"
          pyenv virtualenv 3.12 pyenv-virtualenv-env1
        shell: bash

      - name: Create .venv
        run: python -m venv .venv
        shell: bash

      - name: Create .venv2
        run: python -m venv .venv2
        shell: bash

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Create Pixi environments
        run: |
          pixi init
          pixi add python
          pixi add --feature dev python
          pixi project environment add --feature dev dev
          pixi install --environment dev
        shell: bash

      - name: Rust Tool Chain setup
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Ensure Git bash is on PATH (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          # Git for Windows is always installed on GitHub-hosted runners.
          # Add its bin dir so taiki-e/install-action can find bash.exe.
          # See https://github.com/actions/partner-runner-images/issues/169
          $gitBin = 'C:\Program Files\Git\bin'
          if (Test-Path (Join-Path $gitBin 'bash.exe')) {
            echo $gitBin >> $env:GITHUB_PATH
            Write-Output "Added $gitBin to PATH"
          } else {
            Write-Warning "bash.exe not found at $gitBin"
          }
        shell: pwsh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cargo Fetch
        run: cargo fetch
        shell: bash

      - name: Capture Coverage Measurement Context
        env:
          MEASUREMENT_TARGET: ${{ matrix.target }}
          MEASURED_SHA: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.sha }}
          CREATED_PIPENV_PREFIX: ${{ steps.pipenv.outputs.prefix }}
        run: >-
          python "$RUNNER_TEMP/quality-tools/quality_measurement.py" capture coverage
          --source-dir "$GITHUB_WORKSPACE"
          --workspace "$GITHUB_WORKSPACE"
          --output-dir "$GITHUB_WORKSPACE"
          --target "$MEASUREMENT_TARGET"
          --expected-source "$MEASURED_SHA"
          --workflow-revision "$GITHUB_SHA"
          --pipenv-prefix "$CREATED_PIPENV_PREFIX"
        shell: bash

      - name: Run Tests with Coverage
        id: coverage
        run: cargo llvm-cov --features ci --lcov --output-path lcov.info -- --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace
          PET_SUBPROCESS_COVERAGE_PROOF: ${{ github.workspace }}/subprocess-coverage.json
        shell: bash

      - name: Verify Isolated Server Coverage
        if: always()
        run: python scripts/coverage_detail.py proof --manifest subprocess-coverage.json --output subprocess-coverage
        shell: bash

      - name: Report Production and Changed Coverage
        if: always()
        run: >-
          python scripts/coverage_detail.py report
          --lcov lcov.info
          --base "${{ github.event.pull_request.base.sha }}"
          --output production-coverage
        shell: bash

      - name: Upload Coverage Measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-measurement-${{ matrix.os }}-${{ matrix.revision }}-${{ github.run_attempt }}
          path: |
            lcov.info
            measurement-context.json
            source-revision.txt
            production-coverage/
            subprocess-coverage/
            subprocess-coverage.json
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: measurements
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: Linux
            comment_header: coverage-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows
            comment_header: coverage-windows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Python to PATH
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Stage Coverage Comparison Helper
        run: >-
          python scripts/quality_measurement.py stage
          --source-dir "$GITHUB_WORKSPACE"
          --output-dir "$RUNNER_TEMP/quality-tools"
          --revision "$GITHUB_SHA"
        shell: bash

      - name: Download Head Coverage Measurement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-measurement-${{ matrix.os }}-head-${{ github.run_attempt }}

      - name: Download Exact PR Base Coverage
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-measurement-${{ matrix.os }}-base-${{ github.run_attempt }}
          path: baseline-coverage

      - name: Compare Coverage Snapshot
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          MEASUREMENT_TARGET: ${{ matrix.target }}
          MEASUREMENTS_RESULT: ${{ needs.measurements.result }}
          PLATFORM: ${{ matrix.platform }}
        run: >-
          python "$RUNNER_TEMP/quality-tools/quality_measurement.py" compare coverage
          --current-dir .
          --baseline-dir baseline-coverage
          --expected-head "$HEAD_SHA"
          --expected-base "$BASE_SHA"
          --target "$MEASUREMENT_TARGET"
          --measurements-result "$MEASUREMENTS_RESULT"
          --platform "$PLATFORM"
          --report coverage-report.md
          --summary "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload PR Coverage Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-pr-${{ matrix.os }}
          path: |
            lcov.info
            measurement-context.json
            source-revision.txt
            baseline-coverage/
            coverage-report.md
            production-coverage/
            subprocess-coverage/
            subprocess-coverage.json
          if-no-files-found: ignore

      - name: Post Coverage Comment
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ${{ matrix.comment_header }}
          path: coverage-report.md
